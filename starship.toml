add_newline = true

format = """
$directory\
$git_branch\
$git_status\
$fill\
$cmd_duration\
$nodejs\
$java\
$python\
$docker_context\
$kubernetes\
$line_break\
$character
"""

[directory]
truncation_length = 4
truncate_to_repo = false

[git_branch]
symbol = " "
format = "[$symbol$branch]($style) "

[git_status]
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"
modified = "!${count}"
staged = "+${count}"
untracked = "?${count}"

[fill]
symbol = " "

[cmd_duration]
min_time = 2000
format = "[$duration]($style) "

[nodejs]
symbol = " "

[java]
symbol = " "

[python]
symbol = " "

[docker_context]
symbol = " "

[kubernetes]
disabled = false
symbol = "󱃾 "

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"
